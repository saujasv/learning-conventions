<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 60%;
            margin: 0 auto;
            padding: 15px;
        }
        .images-container {
            display: flex;
            flex-wrap: wrap; /* This allows items to wrap to the next line */
            justify-content: space-between;
            gap: 15px;
            margin: 5px 0;
            width: 100%;
            overflow-x: visible; /* Change from auto to visible since we don't need horizontal scrolling anymore */
        }
        .image-option {
            border: 2px solid #ddd;
            padding: 6px;
            cursor: pointer;
            transition: border-color 0.3s;
            flex: 0 0 calc(30% - 15px);
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .image-option:hover {
            border-color: #999;
        }
        .image-option.selected {
            border-color: #0066cc;
        }
        .image-option img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        .description-box {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            min-width: 180px;
        }
        .btn:hover {
            background-color: #0055aa;
        }
        .trial-history {
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .history-item.correct {
            border-left: 4px solid green;
        }
        .history-item.incorrect {
            border-left: 4px solid red;
        }
        .history-desc {
            font-style: italic;
            margin-bottom: 5px;
        }
        .history-result {
            font-weight: bold;
        }
        .correct-badge {
            color: green;
        }
        .incorrect-badge {
            color: red;
        }
        .history-stats {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .feedback-box {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 18px;
            animation: fadeOut 5s forwards;
            animation-delay: 3s;
        }
        .feedback-box.correct {
            background-color: rgba(0, 128, 0, 0.1);
            border: 1px solid green;
        }
        .feedback-box.incorrect {
            background-color: rgba(255, 0, 0, 0.1);
            border: 1px solid red;
        }
        .feedback-detail {
            font-size: 16px;
            margin-top: 5px;
        }
        .stats-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .text-button {
            color: #0066cc;
            text-decoration: underline;
            cursor: pointer;
        }
        .toggle-history-btn {
            width: 100%;
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
            text-align: center;
        }
        .history-container {
            margin-top: 30px;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <h1>Reference Game</h1>
    {% block content %}{% endblock %}
</body>
</html>
